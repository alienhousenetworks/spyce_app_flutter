name: spyce
description: SPYCE — Intent-First Dating. Premium Flutter client.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  uuid: ^4.6.0
  connectivity_plus: ^7.3.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  collection: ^1.19.1
  web_socket_channel: ^3.0.3
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  shimmer: ^3.0.0
  flutter_webrtc: ^1.5.2
  permission_handler: ^12.0.3
  image_picker: ^1.2.3
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  sensors_plus: ^6.1.1
  crypto: ^3.0.6
  webview_flutter: ^4.14.1
  # Native Face Liveness (no WebView / React required):
  # - amplify_flutter + amplify_auth_cognito → Cognito Identity Pool guest creds
  # - face_liveness_detector → official Amplify Face Liveness UI on Android/iOS
  #   (pub has no package named amplify_liveness_detection)
  # Cognito IDs: backend /verification/status/ or Env defaults (never REKOGNITION secrets)
  amplify_flutter: ^2.6.0
  amplify_auth_cognito: ^2.6.0
  face_liveness_detector: ^0.2.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/
    - assets/images/

# App icon + adaptive icons from neon Spyce wordmark (square master)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/spyce_icon_1024.png
  adaptive_icon_background: "#1A1410"
  adaptive_icon_foreground: assets/images/spyce_icon_1024.png
  remove_alpha_ios: true
  min_sdk_android: 21

